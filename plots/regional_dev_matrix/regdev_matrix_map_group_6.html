<!doctype html>
<html data-theme="light">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>NUTS3</title>
    <script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
    <link
      href="https://unpkg.com/deck.gl@^9.0.0/dist/stylesheet.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <style>
     body {
       width: 100%;
       height: 100%;
       margin: 0;
     }
     .deck-widget {
       --button-size: 20px;
     }
     .deck-tooltip {
       font-family: 'Montserrat', sans-serif;
       font-size: 12px;
       color: white  !important;
       background-color: #252a53 !important;
     }
     #map-wrapper {
       width: 100%;
       height: 100%;
       position: unset !important;
     }
    </style>
  </head>

         const createPolygonLayer = () =>
           new PolygonLayer({
             id: "PolygonLayer",
             data: "layers/polygon_layer.json",
             pickable: true,
             getPolygon: d => d.border,
             filled: true,

         let polygonLayer = createPolygonLayer();

         const deckgl = new DeckGL({
           container: 'map-wrapper',
           map: maplibregl,
           mapStyle: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",

             latitude: 57,
             longitude: 14,
             maxZoom: 20,
             minZoom: 0,
             pitch: 0,
             zoom: 2,
           },
           views: [new MapView({ id: "map", controller: true })],
           getTooltip: ({ object }) =>
             object ? `${object.NUTS_ID}\n${object.NUTS_NAME}` : null,
           getCursor: ({ isHovering }) => (isHovering ? 'default' : 'default'),
           layers: [polygonLayer],
           widgets: [
             new CompassWidget({ id: "compass", viewId: "map" }),
             new ZoomWidget({ id: "zoom", viewId: "map" }),
           ],
         });
       })();
      </script>
    </div>
  </body>
</html>
