<!doctype html>
<html data-theme="light">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>NUTS3</title>
    <script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
    <link
      href="https://unpkg.com/deck.gl@^9.0.0/dist/stylesheet.css"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <style>
     body {
       width: 100%;
       height: 100%;
       margin: 0;
     }
     .deck-widget {
       --button-size: 20px;
     }
     .deck-tooltip {
       font-family: 'Montserrat', sans-serif;
       font-size: 12px;
       color: white  !important;
       background-color: #252a53 !important;
     }
     #map-wrapper {
       width: 100%;
       height: 100%;
       position: unset !important;
     }
    </style>
  </head>
  <body>
    <div id="map-wrapper">
      <script>
       (() => {
         const defaultFillColor = [190, 190, 200, 255];
         const selectedFillColor = [172, 87, 55, 255];

         // Preselected NUTS_ID regions
         const preselectedRegions = new Set(
           ['AT211', 'AT127', 'AT332', 'PT170', 'NL213', 'NL212', 'NL211', 'NL131', 'NL124', 'NL112', 'NL111', 'NL226', 'NL321', 'NL414', 'NL413', 'NL412', 'NL411', 'NL33C', 'NL328', 'NL325', 'NL324', 'NL323', 'NL33A', 'LT011', 'SK010', 'CH012', 'CH011', 'CH013', 'CH021', 'CH023', 'CH065', 'CH064', 'CH063', 'CH062', 'CH061', 'CH055', 'CH054', 'CH053', 'CH040', 'CH033', 'CH031', 'CH024', 'CH022', 'NO092', 'NO091', 'NO082', 'NO081', 'NO074', 'NO071', 'NO060', 'NO020', 'SE124', 'DEA41', 'DE40D', 'DE405', 'DE404', 'DE403', 'DE402', 'DE401', 'DE300', 'DE27A', 'DE721', 'DE253', 'DE243', 'DE242', 'DE273', 'DE271', 'DE26C', 'DE265', 'DE263', 'DE724', 'DEA16', 'DEA14', 'DEA13', 'DEA11', 'DE945', 'DEA33', 'DEA32', 'DEA2D', 'DEA2B', 'DEA2A', 'DEA24', 'DEA23', 'DEA22', 'DEA1A', 'DE944', 'DE916', 'DE911', 'DE80L', 'DE804', 'DE803', 'DE93A', 'DE938', 'DE929', 'DE928', 'DE91C', 'BE256', 'BE341', 'BE310', 'DK014', 'DE21H', 'DE21F', 'DE21C', 'DE21B', 'DE21A', 'DE217', 'DE216', 'DE215', 'DE213', 'DE21K', 'DE21L', 'DE233', 'DE232', 'DE231', 'DE225', 'DE222', 'DE21N', 'DE21M', 'DE144', 'DE121', 'DE11D', 'DE11C', 'DE117', 'DE116', 'DE115', 'DE113', 'DE112', 'DE111', 'DK042', 'DE122', 'DE123', 'DE125', 'DE139', 'DE138', 'DE131', 'DE12A', 'DE128', 'DE126', 'ES212', 'FRK28', 'FRK27', 'FRJ26', 'FRJ21', 'DED41', 'DED21', 'DEB3H', 'DEB3F', 'DEF02', 'DEF01', 'DED51', 'DEB3C', 'DEB11', 'DEA52', 'DEA47', 'DEB38', 'DEB37', 'DEB36', 'DEB35', 'DEB33', 'DEB32', 'DEB23', 'DEB21', 'DEB24', 'DEF04', 'IE062', 'DEG09', 'DEG07', 'DEG05', 'DEG04', 'DEG03', 'DEG02', 'DEG01', 'DEF0F', 'DEF0D', 'DEF0C', 'DEF08', 'DEF07', 'DEG0F', 'DEG0H']
         );

         const { DeckGL, MapView, PolygonLayer, CompassWidget, ZoomWidget } = deck;

         const createPolygonLayer = () =>
           new PolygonLayer({
             id: "PolygonLayer",
             data: "layers/polygon_layer.json",
             pickable: true,
             getPolygon: d => d.border,
             filled: true,
             getLineColor: [37, 42, 83, 255],
             getFillColor: d =>
               preselectedRegions.has(d.NUTS_ID) ? selectedFillColor : defaultFillColor,
             lineWidthMinPixels: 0.7,
             opacity: 0.6,
           });

         let polygonLayer = createPolygonLayer();

         const deckgl = new DeckGL({
           container: 'map-wrapper',
           map: maplibregl,
           mapStyle: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
           initialViewState: {
             bearing: 0,
             latitude: 57,
             longitude: 14,
             maxZoom: 20,
             minZoom: 0,
             pitch: 0,
             zoom: 2,
           },
           views: [new MapView({ id: "map", controller: true })],
           getTooltip: ({ object }) =>
             object ? `${object.NUTS_ID}\n${object.NUTS_NAME}` : null,
           getCursor: ({ isHovering }) => (isHovering ? 'default' : 'default'),
           layers: [polygonLayer],
           widgets: [
             new CompassWidget({ id: "compass", viewId: "map" }),
             new ZoomWidget({ id: "zoom", viewId: "map" }),
           ],
         });
       })();
      </script>
    </div>
  </body>
</html>
