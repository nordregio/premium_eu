<!doctype html>
<html data-theme="light">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>PREMIUM-EU</title>

    <script src="https://unpkg.com/htmx.org@1.9.6"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/deck.gl@^9.0.0/dist.min.js"></script>
    <link
      href="https://unpkg.com/deck.gl@^9.0.0/dist/stylesheet.css"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.js"></script>
    <link
      href="https://unpkg.com/maplibre-gl@3.0.0/dist/maplibre-gl.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>

    <style>

     body {
       width: 100%;
       height: 100%;
       margin: 0;
       padding: 0px 0px 10px 0px;
       overflow: hidden;
     }
     .deck-widget {
       --button-size: 36px;
     }
     .deck-tooltip {
       font-family: 'Montserrat', sans-serif;
       font-size: 12px;
       color: white  !important;
       background-color: #252a53 !important;
     }

     #map-wrapper {
       width: 100vw;
       height: 100vh;
       position: relative;
     }

     /* Set root font size for responsive scaling */
     html {
       font-size: 16px; /* Base font size */
     }

     @media (max-width: 1024px) {
       html {
         font-size: 14px; /* Smaller base for mobile */
       }
     }

     @media (min-width: 1025px) and (max-width: 1440px) {
       html {
         font-size: 15px;
       }
     }

     @media (min-width: 1441px) {
       html {
         font-size: 16px;
       }
     }
     .loader {
       position: absolute;
       bottom: 30px;
       right: 50%;
       z-index: 1000;
       width: 90px;
       height: 14px;
       background: repeating-linear-gradient(90deg,#252a53 0 calc(25% - 5px),#0000 0 25%) left/calc(4*100%/3) 100%;
       animation: l1 0.5s infinite linear;
     }
     @keyframes l1 {
       100% {background-position: right}
     }
    </style>
  </head>

  <body>

    <div id="map-wrapper">

      <div id="loader" class="loader"></div>

      <script>
       function createPolygonLayer(data) {
         return new deck.PolygonLayer({
           id: "PolygonLayer",
           data: data || [],
           pickable: true,
           getPolygon: d => d.border || [],
           getFillColor: d => d.fill_color_integration_index || [150, 150, 150, 255],
           getLineColor: [255, 255, 255, 255],
           lineWidthMinPixels: 0.3,
           opacity: 1,
         });
       }

       (async () => {
         const { DeckGL, MapView, CompassWidget, ZoomWidget } = deck;
         let polygonLayer = createPolygonLayer([]);

         window.deckgl = new DeckGL({
           container: 'map-wrapper',
           map: maplibregl,
           mapStyle: "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json",
           initialViewState: {
             bearing: 0,
             latitude: 58,
             longitude: 30,
             maxZoom: 20,
             minZoom: 3,
             pitch: 0,
             zoom: 3,
           },
           views: [new MapView({ id: "map", controller: true })],

           layers: [polygonLayer],
           getTooltip: ({ object }) =>
             object
             ? {
               html: `
                 <div>
                   <strong>${object.NUTS_NAME}</strong> (${object.NUTS_ID})<br>
                   ${object.CNTR} <br><br>
                   <table style="width: 100%; border-collapse: collapse;">
                     <tr>
                       <td style="text-align: left; font-weight: 700;">Integration index:   </td>
                       <td style="text-align: right;">${object.integration_index}</td>
                     </tr>
                     <tr>
                       <td style="text-align: left; font-weight: 700;">Number of respondents:</td>
                       <td style="text-align: right;">${object.n_respondents}</td>
                     </tr>
                   </table>
                 </div>
               `,
             }
             : null,
           getCursor: ({ isHovering }) => (isHovering ? 'crosshair' : 'default'),
           widgets: [
             new CompassWidget({ id: "compass", viewId: "map" }),
             new ZoomWidget({ id: "zoom", viewId: "map" }),
           ],
         });

         // Load migration integration data
         loadMigrationData();
       })();

       const loaderEl = document.getElementById("loader");

       async function loadMigrationData() {
         const filePath = `data/migration_integration/index.json`;

         const loaderTimeout = setTimeout(() => {
           loaderEl.style.display = "block";
         }, 50);

         try {
           const response = await fetch(filePath);
           if (!response.ok) throw new Error(`Failed to load ${filePath}`);

           let data = await response.json();
           if (!Array.isArray(data)) {
             console.error("Data is not an array. Wrapping it.");
             data = [data];
           }

           if (window.deckgl) {
             window.deckgl.setProps({
               layers: [createPolygonLayer(data)]
             });
           }
         } catch (error) {
           console.error(`Error loading integration data:`, error);
         } finally {
           clearTimeout(loaderTimeout);
           loaderEl.style.display = "none";
         }
       }

       window.onload = function() {
         loadMigrationData();
       };
      </script>
    </div>

  </body>
</html>
